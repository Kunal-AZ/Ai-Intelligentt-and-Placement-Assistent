<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 97 97">
  <style>
    .fav-dark { display: none; }
    .fav-light { display: block; }
    @media (prefers-color-scheme: dark) {
      .fav-light { display: none; }
      .fav-dark { display: block; }
    }
  </style>
  <image href="data:image/png;base64," width="97" height="97" class="fav-dark" />
  <image href="data:image/png;base64," width="97" height="97" class="fav-light" />
</svg>