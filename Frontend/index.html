<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HiPlacement — AI Career & Placement Platform. Evidence-backed resume intelligence, skill gap detection, and real-time AI mock interviews." />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('hiplacement-theme') || localStorage.getItem('pathway-theme');
          const isLight = savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches);
          const activeTheme = isLight ? 'light' : 'dark';
          document.documentElement.dataset.theme = activeTheme;
          document.documentElement.style.colorScheme = activeTheme;
          document.documentElement.style.backgroundColor = isLight ? '#f8f9fa' : '#09090b';
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#09090b';
        }
      })();
    </script>
    <title>HiPlacement · AI Career & Placement Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
