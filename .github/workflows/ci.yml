name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-quality:
    name: Node.js Quality (Monorepo, Backend & Frontend)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      AUDIT_MONGO_URI: mongodb://127.0.0.1:27017
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_must_be_at_least_32_characters_long
      GEMINI_API_KEY: mock_key_for_ci_pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Code linting
        run: npm run lint

      - name: Automated unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  python-quality:
    name: Multi-Agent AI Quality (Python FastAPI & LangGraph)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: mock_gemini_key_for_testing
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DATABASE: placement_assistant_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'Multi-agent AI/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Multi-agent AI/backend/requirements.txt"

      - name: Verify system routes, graph compilation & exception handlers
        run: python "Multi-agent AI/backend/verify_system.py"

      - name: Workflow regression tests
        working-directory: Multi-agent AI/backend
        run: python -m unittest discover -s tests -v

  docker-compose-validate:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config
