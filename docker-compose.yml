services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./Multi-agent AI
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # MONGODB_URI takes precedence in the FastAPI service.  Override the
      # host-oriented value from .env so the container reaches the Compose
      # Mongo service instead of trying to connect to itself.
      MONGODB_URI: mongodb://mongodb:27017/placement_assistant
      MONGODB_DATABASE: placement_assistant
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/placement_assistant
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-worker:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    command: npm run worker --workspace=@placement-assistant/api
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/placement_assistant
      REDIS_URL: redis://redis:6379
      # The worker performs the placement workflow, so it must use the
      # Compose service hostname rather than localhost (the worker itself).
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
